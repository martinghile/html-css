<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios de Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border-collapse: collapse;
            text-align: center;
            width: 500px;
        }
        th {
            font-weight: bolder;
        }
        td {
            font-weight: 100;
        }
        td, th {
            border: 1px solid black;
            padding: 5px;
        }
        tr.destaque {
            background-color: greenyellow;
        }
        .csexo {
            background-color: greenyellow;
        }
    </style>
</head>

<body>
    <h1>Exercício de Tabela</h1>

    <table>
        <colgroup>
            <col>
            <col class="csexo">
            <col>
            <col>
        </colgroup>
        <tr>
            <th>Nome</th>
            <th>Sexo</th>
            <th>Idade</th>
            <th>Profissão</th>
        </tr>
        <tr>
            <td>Claúdio</td>
            <td>M</td>
            <td>28</td>
            <td>Programador</td>
        </tr>
        <tr class="destaque">
            <td>Gustavo</td>
            <td>M</td>
            <td>42</td>
            <td>Professor</td>
        </tr>
        </tr>
            <td>Hélio</td>
            <td>M</td>
            <td>19</td>
            <td>Vendedor</td>
        </tr>
        </tr>
            <td>Maria</td>
            <td>F</td>
            <td>39</td>
            <td>Médica</td>
        </tr>
        </tr>
            <td>Otávio</td>
            <td>M</td>
            <td>22</td>
            <td>Nutri</td>
        </tr>
    </table>
</body>

</html>
