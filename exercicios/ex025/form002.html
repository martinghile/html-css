<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
        }
        ::placeholder {
            color: rgba(57, 42, 57, 0.544);
        }
    </style>
</head>

<body>
    <h1>Meu primeiro Formulário</h1>
    <form method="post" autocomplete="on">
        <p><label for="iusu">Usuário:</label>
            <input type="text" name="usu" id="iusu" placeholder="João">
        </p>

        <p><label for="isen">Senha: </label>
            <input type="password" name="sen" id="isen" placeholder="Raimundo" required minlength="8">
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="limpar">
        </p>
    </form>
</body>

</html>
