<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagens dinâmicas</title>
</head>
<body>
    <h2>Imagens dinâmicas</h2>
    <p>Tente abrir esse site em vários dispositivos para ver as imagens mudando conforme o tamanho da tela.</p>
    <picture>
        <source media="(max-width: 750px)" srcset="imagens/imagem-p.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/imagem-m.png" type="image/png">
        <img src="imagens/imagem-g.png" alt="Imagem para flexivel" media="(min-width: 1024px)">
    </picture>

    <h2>Reproduzir Áudio</h2>

    <audio controls>
        <source src="media/Wildfire - Jessie Villa.mp3" type="audio/mpeg">
        <source src="media/Wildfire - Jessie Villa.ogg" type="audio/ogg">
        <source src="media/Wildfire - Jessie Villa.wav" type="audio/wav">
        <p>Infelizmente seu navegador não suporta o elemento de áudio.</p>
        <!--Compativel com MP3(type MPEG), OGG(type OGG) e WAV(type WAV)-->
    </audio>
</body>
</html>
