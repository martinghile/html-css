<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixas</title> 
    <style>
        h1{         /*Box-Level*/
            background-color: lightgray;
            height: 300px;
            width: 300px;
            text-align: center;
            border-width: 10px;
            border-style: solid;
            border-color: darkslategray;

            /* 
                Shorthand = border: 10px solid darkslategray;
            */ 

            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: 10px;
            padding-right: 10px;

            /*
                Shortihand = padding: 10px 10px 10px 10px;

                como é tudo 10px, pode colocar só uma vez que vai igual.
            */
            
            margin-top: 20px;
            margin-right: 20px;
            margin-bottom: 40px;
            margin-left: 20px;

            /*
                Shorthand = margin: 20px 20px 40px 20px
            */

            outline-width: 5px;
            outline-style: dashed;
            outline-color: salmon;

            /*
                Shorthand = outline: 5px dashed salmon;
            */

        }

        
        a{              /*Inline-leval*/
            border-width: 3px;
            border-style: solid;
            border-color: red;
            background-color: rgb(76, 73, 10);
            color: white;
            text-decoration: none;
            padding-top: 2px;
            padding-right: 2px;
            padding-bottom: 2px;
            padding-left: 2px;

        }
    </style>
</head>
<body>
    <h1>Exemplo de Caixa Box-Level</h1>
    <p>Parágrafos também são exemplos de box-level, mas os <a href="a"> links são exemplos de caixas inline-level</a>. Vamos ver como tudo isso funciona.</a></p>
</body>
</html>
