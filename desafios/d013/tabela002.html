<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio da Tabela 2</title>
    <style>
        .color {
            background-color: rgb(7, 124, 112);
        }
        .diference {
            background-color: rgb(47, 0, 117);
            color: white;
            font-weight: bold;
        }
        body {
            font-family: Arial, sans-serif;
            font-size: 1em;
            margin: 0;
        }

        table {
            width: 500px;
            font-size: 1.5em;
        }

        th,
        td {
            border: 2px solid rgba(255, 0, 0, 0.463);
            padding: 8px;
            text-align: center;
        }

        th {
            font-weight: normal;
        }
    </style>
</head>

<body>
    <table>
    <tbody>
        <tr>
            <td class="diference" colspan="4">A</td>
            <td class="diference" rowspan="4">B</td>
            
        </tr>
        <tr>
            <td class="diference" rowspan="4">c</td>
            <td>D</td>
            <td class="color">E</td>
            <td>F</td>
  
        </tr>
        <tr>
            <td class="color">G</td>
            <td class="color">H</td>
            <td class="color">I</td>
        </tr>
        <tr>
            <td>J</td>
            <td class="color">L</td>
            <td>M</td>
        </tr>
        <tr>
            <td class="diference" colspan="4">N</td>     
        </tr>

</body>

</html>
