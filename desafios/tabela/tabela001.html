<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio da Tabela</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 1em;
            margin: 0;
        }

        table {
            width: 500px;
            font-size: 1.5em;
        }

        th,
        td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }

        th {
            font-weight: normal;
        }
    </style>
</head>

<body>
    <h1>Desafio da Tabela</h1>
    <table>
        <tbody>
            <tr>
                <th>1</th>
                <th>2</th>
                <td rowspan="2">3</td>
                <th>4</th>
            </tr>
            <tr>
                <td>5</td>
                <td>6</td>

                <td>7</td>
            </tr>
            <tr>
                <td colspan="3">8</td>
                <td>9</td>
            </tr>
            <tr>
                <td rowspan="2">10</td>
                <td colspan="2">11</td>
                <td>12</td>
            </tr>
            <tr>
                <td>13</td>
                <td>14</td>
                <td>15</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
